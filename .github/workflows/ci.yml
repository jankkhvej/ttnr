# Quality gate on every PR and push to main: the same ./scripts/check.zsh
# as locally (fmt, clippy, tests with generated fixtures, cargo deny,
# third-party notices). A standard macOS runner is free for public
# repositories; larger runners are not (docs/RESEARCH.md, 2026-11-06;
# ADR-050). Actions are pinned to commit SHAs (tag in the comment).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Newer pushes to a PR cancel its older run; every commit on main is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      # Smaller cache, no stale incremental state.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libmpv (ttnr-engine links it via pkg-config) and the ffmpeg CLI
      # (fixtures). `brew update` first: the image's Homebrew can be a day old
      # and would install an older mpv than developers have (ADR-049/050).
      - name: Homebrew dependencies
        run: |
          brew update --quiet
          brew install mpv ffmpeg pkgconf
          echo "MPV_VERSION=$(brew list --versions mpv | cut -d' ' -f2)" >> "$GITHUB_ENV"

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Saved after every run (run id), restored from the newest with the
          # same toolchain, lock file and mpv (link paths come from mpv.pc).
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-mpv${{ env.MPV_VERSION }}-${{ github.run_id }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-mpv${{ env.MPV_VERSION }}-

      - name: Versions
        run: |
          sw_vers
          rustc --version
          pkg-config --modversion mpv
          ffmpeg -hide_banner -version | head -1

      - name: Quality gate
        run: ./scripts/check.zsh
