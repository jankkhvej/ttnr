# ttnr theme: pdp11-vt100 – a DEC PDP-11 (RSX-11M) seen through a DEC VT100.
# Researched 2026-11-03 (docs/THEMES.md, RESEARCH.md "Retro themes"):
# VT100 80×24, P4 white phosphor, monochrome (emphasis by bold/reverse),
# DEC Special Graphics line drawing, RSX-11M prompt MCR>, octal numbers.
name      = "pdp11-vt100-amber"
title     = "TTNR"

[palette]                       # amber variant (VT220-era tubes; not a VT100 fact)
fg     = "#ffb000"
bg     = "#000000"
accent = "#ffc840"
dim    = "#a06a00"
warn   = "#ffc840"
error  = "#ffc840"

[palette_16]
fg     = "yellow"
accent = "bright_yellow"
dim    = "bright_black"
warn   = "bright_yellow"
error  = "bright_yellow"

[glyphs]                        # only characters from the VT100 repertoire
borders   = "box"               # DEC Special Graphics ┌┐└┘─│
ellipsis  = "..."
dash      = " - "
separator = "  "
playing   = "◆"                 # DEC Special Graphics diamond
paused    = "·"
busy      = "▒"                 # DEC Special Graphics checkerboard
stopped   = "·"
error     = "?"
current   = "◆"
cursor    = ">"

[screen]
width  = 80
height = 24
border = "#000000"

[text]
uppercase = true                # RSX-11M output style
numbers   = "octal"             # DEC convention
percent_sign = false            # "VOL 144", not "VOL 144%"

[chrome]
banner       = ["RSX-11M V4.6 BL56   TTNR V0.1", ""]
prompt       = "MCR>"
cursor       = "block"
cursor_blink = true
serial       = true             # speed key: 9600/1200/300/110 baud

[status]                        # RSX-style messages
idle         = ">"
resolving    = "{glyph} RESOLVING..."
loading      = "{glyph} LOADING..."
buffering    = "{glyph} BUFFERING{percent}"
playing      = "{glyph} PLAYING"
paused       = "{glyph} PAUSED"
reconnecting = "?TTNR-W-{message}"
ended        = "?TTNR-I-END OF STREAM"
error        = "?TTNR-F-{message}"

[effects]
boot      = "vt100"
boot_text = [                   # RSX-11M V4.6 console boot (SIMH logs)
  "RSX-11M V4.6 BL56   128.K MAPPED",
  ">RED DU:=SY:",
  ">RED DU:=LB:",
  ">MOU DU:RSXM56",
  ">@DU:[1,2]STARTUP",
  ">",
]
