[package]
name = "ttnr"
description = "Minimal, themeable terminal player for network music streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ttnr"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ttnr-core.workspace = true
ttnr-engine.workspace = true

[lints]
workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-2-Clause"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libmpv2 = { version = "7.0.0", default-features = false }
pkg-config = "0.3.34"
thiserror = "2"

ttnr-core = { path = "crates/ttnr-core" }
ttnr-engine = { path = "crates/ttnr-engine" }
ttnr-platform = { path = "crates/ttnr-platform" }
ttnr-sources = { path = "crates/ttnr-sources" }
ttnr-themes = { path = "crates/ttnr-themes" }
ttnr-tui = { path = "crates/ttnr-tui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
