[package]
name = "ttnr"
description = "Minimal, themeable terminal player for network music streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "ttnr"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
futures.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "time", "net", "io-util"] }
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ttnr-core.workspace = true
ttnr-engine.workspace = true
ttnr-platform.workspace = true
ttnr-sources.workspace = true
ttnr-themes.workspace = true
ttnr-tui.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
license = "BSD-2-Clause"
repository = "https://github.com/jankkhvej/ttnr"
homepage = "https://github.com/jankkhvej/ttnr"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
insta = "1.49.0"
libmpv2 = { version = "7.0.0", default-features = false }
libmpv2-sys = "4.0.1"
pkg-config = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2"
toml = "1.1.8"
tokio = { version = "1.54.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = "0.2.5"
unicode-width = "0.2.3"
url = "2.5.8"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

ttnr-core = { path = "crates/ttnr-core" }
ttnr-engine = { path = "crates/ttnr-engine" }
ttnr-platform = { path = "crates/ttnr-platform" }
ttnr-sources = { path = "crates/ttnr-sources" }
ttnr-themes = { path = "crates/ttnr-themes" }
ttnr-tui = { path = "crates/ttnr-tui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Release builds (ADR-044): smaller and a little faster; keep unwinding –
# panics cross the app/AppKit threads (resume_unwind) and the TUI's panic
# hook restores the terminal.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
