# Sample stations file. Copy to ~/.config/ttnr/stations.toml
# (or $XDG_CONFIG_HOME/ttnr/stations.toml) and edit.
#
# Each [[station]] needs `id` (unique), `name` and `source`, the plugin that
# resolves it at play time. Play one with `ttnr play <id>`; list them with
# `ttnr stations`.
#
# `url`: for source "url" it is the stream or playlist itself; for other
# sources an optional manual override (last resort of the resolver chain).
# `params`: optional source-specific settings, e.g. params = { region = "uk" }.

[[station]]
id     = "groovesalad"
name   = "SomaFM Groove Salad"
source = "url"
url    = "https://somafm.com/groovesalad.pls"    # PLS with 3 mirrors (checked 2026-11-02)

[[station]]
id     = "fip"
name   = "FIP (Radio France)"
source = "url"
url    = "https://stream.radiofrance.fr/fip/fip.m3u8?id=radiofrance"   # HLS AAC (checked 2026-11-02)

# BBC stations: `id` is BBC's service id (verified 2026-11-03 against
# rms.api.bbc.co.uk/v2/networks; e.g. bbc_radio_fourfm, bbc_radio_two,
# bbc_world_service). Streams come from BBC itself for your location;
# stations BBC does not offer where you are fail with a clear message.
[[station]]
id     = "bbc_6music"
name   = "BBC Radio 6 Music"
source = "bbc"

[[station]]
id     = "bbc_radio_three"
name   = "BBC Radio 3"
source = "bbc"
