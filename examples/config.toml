# Sample configuration. Copy to ~/.config/ttnr/config.toml
# (or $XDG_CONFIG_HOME/ttnr/config.toml); every setting is optional.

# Theme: a built-in (plain; retro themes in M5) or the `name` of a file
# in ~/.config/ttnr/themes/*.toml. `t` cycles through all of them.
# theme = "plain"

# Colour depth: "auto" (detect: NO_COLOR, COLORTERM, TERM), "truecolor",
# "256", "16", "mono". Terminal.app (macOS 26+) supports truecolor but is
# detected as 256 – set "truecolor" to use it.
# color = "auto"

# Sync offset: seconds to delay track info from external providers (BBC's
# now-playing API, HLS ID3 polling) so it matches what you hear. Tune live
# with ] and [ in the TUI, then put the value here.
# [sync_offset]
# bbc = 0

# Mosaic glyphs used by retro themes (bbc-mode7): "auto" (quadrant blocks
# in Terminal.app, whose fonts lack Unicode sextants; sextants elsewhere),
# "sextant", "quadrant".
# mosaic = "auto"

# Theme animations: boot sequence when a retro theme is switched to,
# ZX Spectrum tape-loading border stripes, ZX80 screen blanking while
# loading. false = never animate.
# effects = true

# Terminal themes (pdp11-teletype, pdp11-vt100*): simulated serial line
# speed in bits per second, 10 bits per character – 110 = Teletype Model 33
# (10 chars/s), 300, 1200, 9600; 0 = instant. The `b` key cycles it live.
# baud = 0

# macOS: show the station and track in Control Center / Now Playing and
# react to media keys (play/pause, next/previous station).
# media_controls = true

# Output device to use while it is connected (as shown by `d`, e.g.
# "AirPods Pro"); otherwise the system default plays. Unset = always follow
# the system default output.
# output_device = "AirPods Pro"

# Bit-perfect-friendly output (both off by default):
# exclusive: ttnr takes the device for itself (CoreAudio hog mode); macOS
#   moves other apps' sound to another output while ttnr plays.
# match_sample_rate: switch the device's sample rate to the stream's (no
#   resampling); a system-wide change (like Audio MIDI Setup) that mpv
#   reverts when it stops.
# exclusive = false
# match_sample_rate = false

# Key bindings (SPEC F5.3 defaults shown). Giving an action replaces its
# default keys; use a string or a list. Key names: a single character,
# space, enter, tab, backspace, esc, up, down, left, right, home, end,
# pageup, pagedown, f1–f24, with optional ctrl- / alt- prefixes.
# Fixed and not remappable: arrows/enter/esc (navigation), j/k in lists,
# ctrl-c (always quits).
[keys]
# toggle_pause = "space"
# volume_up    = ["+", "="]
# volume_down  = "-"
# mute         = "m"
# next_station = "n"
# prev_station = "p"
# stations     = "s"
# open_url     = "o"
# devices      = "d"
# cycle_theme  = "t"
# sync_later   = "]"
# sync_earlier = "["
# cycle_baud   = "b"   # line speed of terminal themes: off/9600/1200/300/110
# help         = "?"
# quit         = "q"
